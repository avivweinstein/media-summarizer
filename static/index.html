<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Summarizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #222; }

    header { background: #111827; color: #fff; padding: 0.9rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; }
    #refresh-status { font-size: 0.75rem; color: #9ca3af; }

    main { max-width: 860px; margin: 1.5rem auto; padding: 0 1rem; }

    .job { background: #fff; border-radius: 10px; margin-bottom: 0.9rem; padding: 1rem 1.2rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; transition: box-shadow .15s; border: 1px solid #e5e7eb; }
    .job:hover { box-shadow: 0 3px 10px rgba(0,0,0,.12); }

    .job-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .job-title { font-weight: 600; font-size: 0.95rem; line-height: 1.4; flex: 1; }
    .job-meta { font-size: 0.78rem; color: #6b7280; margin-top: 0.25rem; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; flex-shrink: 0; }
    .badge-pending    { background: #fef9c3; color: #854d0e; }
    .badge-processing { background: #dbeafe; color: #1e40af; }
    .badge-done       { background: #dcfce7; color: #166534; }
    .badge-failed     { background: #fee2e2; color: #991b1b; }
    .badge-processing::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3b82f6; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

    .detail { display: none; margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid #f3f4f6; }
    .detail.open { display: block; }

    .url-row { margin-bottom: 0.8rem; }
    .url-link { font-size: 0.78rem; color: #6b7280; word-break: break-all; text-decoration: none; }
    .url-link:hover { color: #3b82f6; text-decoration: underline; }

    .tldr { font-size: 0.9rem; line-height: 1.6; color: #374151; margin-bottom: 0.8rem; }

    .section-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 0.4rem; }
    .key-points { list-style: none; padding: 0; margin-bottom: 0.8rem; }
    .key-points li { font-size: 0.86rem; line-height: 1.5; padding: 0.25rem 0 0.25rem 1rem; position: relative; color: #374151; }
    .key-points li::before { content: '•'; position: absolute; left: 0; color: #9ca3af; }

    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.8rem; }
    .tag { background: #eff6ff; color: #1d4ed8; padding: 2px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 500; }

    .footer-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .notion-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 6px 14px; background: #111827; color: #fff; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: 500; }
    .notion-btn:hover { background: #374151; }
    .worth-badge { font-size: 0.78rem; color: #16a34a; font-weight: 500; }

    .error-text { font-size: 0.86rem; color: #dc2626; background: #fef2f2; padding: 0.6rem 0.8rem; border-radius: 6px; border-left: 3px solid #ef4444; }
    .retry-note { font-size: 0.75rem; color: #6b7280; margin-top: 0.2rem; }

    #empty { text-align: center; color: #9ca3af; padding: 4rem 2rem; font-size: 0.95rem; }
    #empty p { margin-bottom: 0.4rem; }
    #empty code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <h1>Media Summarizer</h1>
  <span id="refresh-status">Loading…</span>
</header>

<main>
  <div id="jobs-container"></div>
  <div id="empty" style="display:none">
    <p>No jobs yet.</p>
    <p>POST a URL to <code>/summarize</code> to get started.</p>
  </div>
</main>

<script>
  const openIds = new Set();

  function fmt(iso) {
    return new Date(iso).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
  }

  function fmtDuration(secs) {
    if (!secs) return null;
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderJob(job) {
    const r = job.result;
    const s = job.summary;
    const title = r?.title || job.url.slice(0, 70);
    const metaParts = [r?.source, r?.channel_or_show, fmtDuration(r?.duration_seconds)].filter(Boolean);
    const meta = metaParts.join(' · ');
    const retryNote = job.retry_count > 0
      ? `<div class="retry-note">Attempt ${job.retry_count + 1} of 3</div>` : '';

    let detailHtml = '';
    if (job.status === 'done' && s) {
      const tags = (s.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
      const points = (s.key_points || []).map(p => `<li>${esc(p)}</li>`).join('');
      const notionUrl = job.notion_page_id
        ? `https://www.notion.so/${job.notion_page_id.replace(/-/g,'')}` : null;
      const worthBadge = s.worth_rewatching ? '<span class="worth-badge">★ Worth rewatching</span>' : '';

      detailHtml = `
        <div class="url-row"><a class="url-link" href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.url)}</a></div>
        <div class="tldr">${esc(s.tldr)}</div>
        ${points ? `<div class="section-label">Key Points</div><ul class="key-points">${points}</ul>` : ''}
        ${tags ? `<div class="tags">${tags}</div>` : ''}
        <div class="footer-row">
          ${notionUrl ? `<a class="notion-btn" href="${notionUrl}" target="_blank" rel="noopener">Open in Notion</a>` : ''}
          ${worthBadge}
        </div>
      `;
    } else if (job.status === 'failed') {
      detailHtml = `
        <div class="url-row"><a class="url-link" href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.url)}</a></div>
        <div class="error-text">${esc(job.error || 'Unknown error')}</div>
      `;
    } else {
      detailHtml = `
        <div class="url-row"><a class="url-link" href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.url)}</a></div>
        <div class="retry-note">Processing…</div>
      `;
    }

    const isOpen = openIds.has(job.job_id);
    return `
      <div class="job" onclick="toggle('${job.job_id}')">
        <div class="job-header">
          <div style="flex:1;min-width:0">
            <div class="job-title">${esc(title)}</div>
            ${meta ? `<div class="job-meta">${esc(meta)}</div>` : ''}
            <div class="job-meta">${fmt(job.created_at)}</div>
            ${retryNote}
          </div>
          <span class="badge badge-${job.status}">${job.status}</span>
        </div>
        <div class="detail ${isOpen ? 'open' : ''}">${detailHtml}</div>
      </div>
    `;
  }

  function toggle(id) {
    openIds.has(id) ? openIds.delete(id) : openIds.add(id);
    render(window.__jobs || []);
  }

  function render(jobs) {
    window.__jobs = jobs;
    const container = document.getElementById('jobs-container');
    const empty = document.getElementById('empty');
    if (jobs.length === 0) {
      container.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      container.innerHTML = jobs.map(renderJob).join('');
    }
  }

  async function poll() {
    try {
      const resp = await fetch('/jobs');
      render(await resp.json());
      document.getElementById('refresh-status').textContent =
        'Updated ' + new Date().toLocaleTimeString(undefined, { timeStyle: 'short' });
    } catch {
      document.getElementById('refresh-status').textContent = 'Error — retrying…';
    }
  }

  poll();
  setInterval(poll, 5000);
</script>

</body>
</html>
